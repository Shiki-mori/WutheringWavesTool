server {
    listen 8081;
    server_name localhost;

    root /srv/www/gacha;
    index index.html;

    # Swagger / Knife4j 文档入口与静态资源
    location = /doc.html {
        proxy_pass http://127.0.0.1:8080;
    }

    location /webjars/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /swagger-resources/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /v2/api-docs {
        proxy_pass http://127.0.0.1:8080;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
    }

    location /v3/api-docs/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口转发（Java后端默认8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /average {
        proxy_pass http://127.0.0.1:8080;
    }

    location /hello {
        proxy_pass http://127.0.0.1:8080;
    }
}
